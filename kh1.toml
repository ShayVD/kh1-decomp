# kh1-decomp project configuration. Read by tools/kh1tool.py.
# Everything target-specific lives here so the tools stay generic.

[target]
# The user's own dump. Never commit it (see .gitignore).
# Kingdom Hearts Final Mix, SLPS-25198 (retail, unpatched). Pinned in session 1.
elf = "SLPS_251.98"
sha256 = "1993a4daa9e90205ebd00d332517c5dace3d2411ba0a3952008048b98f5a6298"
# Optional override of the code range scanned for functions. Empty = use the
# .text section if present, else the executable PT_LOAD segment.
# End of code in the main section (docs/elf-notes.md).
text_start = "0x00100000"
text_end = "0x00272c70"
# Value of $gp if the game uses small data (-G > 0). Empty = not used.
gp = ""

[toolchain]
# A compiler id from tools/toolchains.tsv (decomp.me naming).
# ee-gcc 2.96 + -O2 -G0 matched 8/8 probe functions (docs/toolchain.md).
compiler = "ee-gcc2.96"
cflags = "-O2 -G0"
cxxflags = "-O2 -G0 -fno-exceptions -fno-rtti"
asflags = "-G0 -march=r5900 -EL"
# Game C is compiled with -fdata-sections -fno-common (session 16), so each global
# variable gets its own .data.<name> section that the build places at its original
# address (docs/shiftable-plan.md "Phase 4"). Not for these paths: newlib's static
# const tables would move into .rodata.<name> and change the matched SDK objects.
data_sections_skip = ["src/sdk/"]

# Per-directory flag overrides, longest prefix wins, e.g. if the SCE libraries
# in the ELF were built with different flags than game code.
# [[toolchain.override]]
# path = "src/sce/"
# compiler = "ee-gcc2.96"
# cflags = "-O2 -G8"

# newlib (libm) is built with -fno-builtin, like newlib's own Makefiles:
# fabsf stays a call (__kernel_tanf) instead of becoming abs.s. Its
# assembler never filled delay slots itself, only gcc did (no_fill,
# docs/toolchain.md).
[[toolchain.override]]
path = "src/sdk/libm/"
cflags = "-O2 -G0 -fno-builtin"
no_fill = true

# Address ranges used to group the progress tracker. Ranges are half-open
# [start, end). Functions outside every range are reported under "other".
# Boundaries from call-graph analysis in session 1 (docs/elf-notes.md).
[[segment]]
name = "game"
start = "0x00100000"
end = "0x0024f2e0"

# Sony libc + SCE SDK 2.5.0 libraries. Not ported; replaced by the Vita layer.
[[segment]]
name = "sdk"
start = "0x0024f2e0"
end = "0x00272c70"

# libgcc2.c's objects (the 64-bit helpers, one file per L_ macro) were
# assembled without delay-slot filling, like newlib: `jal; nop` with the
# argument move before the call. fp-bit/dp-bit were not (docs/sdk.md).
[[toolchain.override]]
path = "src/sdk/libgcc/_"
cflags = "-O2 -G0"
no_fill = true

# Automatic matches of SDK functions that need newlib's unfilled delay slots
# (tools/autodecomp.py --out-dir src/sdk/nofill).
[[toolchain.override]]
path = "src/sdk/nofill/"
cflags = "-O2 -G0 -fno-builtin"
no_fill = true

# SCE library code that matches with the older ee-gcc 2.9-991111 (the SDK's
# own compiler; docs/toolchain.md).
[[toolchain.override]]
path = "src/sdk/gcc991111/"
compiler = "ee-gcc2.9-991111a"
cflags = "-O2 -G0"

# libkernl by hand (SCE code: ee-gcc 2.9-991111).
[[toolchain.override]]
path = "src/sdk/libkernl/"
compiler = "ee-gcc2.9-991111a"
cflags = "-O2 -G0"

# 991111a cc1 assembled by the ee-gcc 2.96 driver's gas, which fills jr delay
# slots that 991111a gas leaves empty (session 6, libkernl-style SCE code).
[[toolchain.override]]
path = "src/sdk/gcc991111_as296/"
compiler = "ee-gcc2.9-991111a"
as_compiler = "ee-gcc2.96"
cflags = "-O2 -G0"

[[toolchain.override]]
path = "src/sdk/gcc991111nf/"
compiler = "ee-gcc2.9-991111a"
cflags = "-O2 -G0"
no_fill = true

# libvu0 code that needs the later ee-gcc 2.9-991111-01, which puts
# `nop; nop` before div.s where 991111a does not (session 5).
[[toolchain.override]]
path = "src/sdk/gcc991111_01/"
compiler = "ee-gcc2.9-991111-01"
cflags = "-O2 -G0"

# libgcc frame.c registration functions: ee-gcc 2.96 without strict
# aliasing (store order; session 5).
[[toolchain.override]]
path = "src/sdk/nostrict/"
cflags = "-O2 -G0 -fno-strict-aliasing"

# newlib's libc: same build as its libm (no_fill shows in mprec.c's ulp,
# d2b and ratio; docs/sdk.md).
[[toolchain.override]]
path = "src/sdk/libc/"
cflags = "-O2 -G0 -fno-builtin"
no_fill = true

# Flag modes (docs/modules.md "Flags"). Each src/hand/<mode>/ override below has a
# `mode` name; a module file anywhere in src/ picks one with its file name,
# <name>.<mode>.c (src/vm/vm_ops.nostrict.c), which wins over directory overrides.
# gcc 2.96 has no per-function optimize attribute, so a module's functions that
# need other flags go in such a sibling file.

# Game files whose delay slots were left to the assembler (gcc's own
# filling off): leaf `jr ra` slots stay empty (session 5).
[[toolchain.override]]
path = "src/hand/nofill/"
mode = "nofill"
cflags = "-O2 -G0"
no_fill = true

# Game files built without strict aliasing (loads stay after stores
# through other types; the script VM around 0x001C08F0, session 5).
[[toolchain.override]]
path = "src/hand/nostrict/"
mode = "nostrict"
cflags = "-O2 -G0 -fno-strict-aliasing"

[[toolchain.override]]
path = "src/hand/nostrict_nofill/"
mode = "nostrict_nofill"
cflags = "-O2 -G0 -fno-strict-aliasing"
no_fill = true

# Game files where gcc's global CSE was off: loads the original repeats are
# merged by gcse with the normal flags (session 6; func_0014b550, func_001ca368).
[[toolchain.override]]
path = "src/hand/nogcse/"
mode = "nogcse"
cflags = "-O2 -G0 -fno-gcse"

[[toolchain.override]]
path = "src/hand/nostrict_nogcse/"
mode = "nostrict_nogcse"
cflags = "-O2 -G0 -fno-strict-aliasing -fno-gcse"


# Around 0x20dd38-0x2173xx the original never adds a symbol to a register with
# one `la rd,sym(rs)` macro (it keeps lui/addiu + addu). -mabi=n32 on the
# C -> asm step only (not the assembler) reproduces that; it stands in for
# whatever compiler variant those files really used (session 6). long is
# 32-bit under n32; KH1_N32 makes common.h define s64/u64 as long long.
[[toolchain.override]]
path = "src/hand/n32/"
mode = "n32"
cflags = "-O2 -G0"
ccflags = "-mabi=n32 -DKH1_N32"

[[toolchain.override]]
path = "src/hand/n32_nogcse/"
mode = "n32_nogcse"
cflags = "-O2 -G0 -fno-gcse"
ccflags = "-mabi=n32 -DKH1_N32"

[[toolchain.override]]
path = "src/hand/n32_nostrict/"
mode = "n32_nostrict"
cflags = "-O2 -G0 -fno-strict-aliasing"
ccflags = "-mabi=n32 -DKH1_N32"

# Session 7: single extra gcc flags found by tools/matching/flagsweep.py. Each
# makes one or more near-miss drafts byte-identical; the original file was
# probably built with that flag (or by a compiler whose pass behaved the same).
[[toolchain.override]]
path = "src/hand/nosi/"
mode = "nosi"
cflags = "-O2 -G0 -fno-sched-interblock"

[[toolchain.override]]
path = "src/hand/nogcse_nosi/"
mode = "nogcse_nosi"
cflags = "-O2 -G0 -fno-gcse -fno-sched-interblock"

[[toolchain.override]]
path = "src/hand/nogcse_nosib/"
mode = "nogcse_nosib"
cflags = "-O2 -G0 -fno-gcse -fno-optimize-sibling-calls"

[[toolchain.override]]
path = "src/hand/faddr/"
mode = "faddr"
cflags = "-O2 -G0 -fforce-addr"

[[toolchain.override]]
path = "src/hand/nostrict_norcse/"
mode = "nostrict_norcse"
cflags = "-O2 -G0 -fno-strict-aliasing -fno-rerun-cse-after-loop"

[[toolchain.override]]
path = "src/hand/norlo/"
mode = "norlo"
cflags = "-O2 -G0 -fno-rerun-loop-opt"

[[toolchain.override]]
path = "src/hand/fmam/"
mode = "fmam"
cflags = "-O2 -G0 -fmove-all-movables"

[[toolchain.override]]
path = "src/hand/nostrict_nosib/"
mode = "nostrict_nosib"
cflags = "-O2 -G0 -fno-strict-aliasing -fno-optimize-sibling-calls"
